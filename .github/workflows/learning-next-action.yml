name: Learning next-action checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.mjs
      - run: npm install --prefix /tmp/esp32-browser playwright@1.56.1
      - name: Check all eight guides and interaction edges
        env:
          PLAYWRIGHT_MODULE: /tmp/esp32-browser/node_modules/playwright
        run: |
          python3 -m http.server 8796 >/tmp/esp32-server.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          node tests/component-fidelity.cjs
          node tests/phone-intro-framing.cjs
          node tests/next-action-guide.cjs
          node tests/next-action-edges.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: learning-next-action-evidence
          path: |
            docs/next-action/local
            docs/next-action/edges
